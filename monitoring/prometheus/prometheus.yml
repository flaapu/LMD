# Configuración de Prometheus para el proyecto de churn.
# Scrapea el endpoint /metrics que expone la API (vía prometheus-fastapi-instrumentator).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "churn-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
